route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-ops

receivers:
  - name: slack-ops
    slack_configs:
      - api_url: "https://hooks.slack.com/services/YOUR_WEBHOOK"
        channel: "#infra-alerts"
        send_resolved: true
        title: "{{ range .Alerts }}{{ .Labels.severity | toUpper }}: {{ .Labels.alertname }}{{ end }}"
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          instance: {{ .Labels.instance }} | severity: {{ .Labels.severity }}
          {{ .StartsAt }}
          {{ end }}
