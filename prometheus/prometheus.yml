global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: app
    static_configs:
      - targets: ["app-exporter:9101"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
